# 单条真实 live task 的非敏感配置模板（可入库）。
# 用法：bash scripts/run_live_task.sh --task-id 0 --live
# 模型连接信息不在此文件；只存在于未提交的 .env。
schema_version: 1
purpose: development_single_live_task

# 任务只能来自本项目声明的开发任务集（Final-200 Clean 禁止进入）
task_source: configs/tasks/development.json

# 最大环境步数（工具调用进入 ShopSimulator 的次数上限）
max_environment_steps: 5

# temperature 默认 0（与 adapter 模型参数的绑定在 profile llm 行验证后接入）
temperature: 0

# 允许的工具：仅限当前已实现的三个冻结工具
allowed_tools:
  - search_products
  - open_product
  - finish_without_purchase

# 脱敏轨迹输出目录（JSONL 不入库）
output_dir: trajectories/

final_benchmark_excluded: true
